# Pull Request Labeler Configuration
# Automatically labels PRs based on changed files

"feature":
  - lib/features/**/*

"bugfix":
  - any: ["**/fix/**", "**/bugfix/**"]

"backend":
  - backend_php/**/*

"documentation":
  - "**/*.md"
  - docs/**/*

"dependencies":
  - pubspec.yaml
  - android/build.gradle*
  - android/Gemfile

"ci/cd":
  - .github/**/*
  - android/fastlane/**/*

"reports":
  - lib/features/reports/**/*

"database":
  - lib/data/database/**/*
  - assets/database/**/*

"ui":
  - lib/theme/**/*
  - lib/**/widgets/**/*

"tests":
  - test/**/*

"contract-impact":
  - any:
      - lib/core/sync/**/*
      - lib/features/sync/**/*
      - lib/features/taxonomies/**/*
      - lib/features/beneficiaries/**/*
      - scripts/smoke_codes_contract.ps1
      - scripts/codes_end_to_end_diagnostics.ps1
      - todo.md
